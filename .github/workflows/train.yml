name: Train ML Model

on:
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: 03_automation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare CI dataset
        run: python prepare_data.py

      - name: Train model
        run: python train.py

      - name: Check model quality
        run: python check_metrics.py

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: bearing-model
          path: |
            03_automation/models/model.pkl
            03_automation/metrics/metrics.json
