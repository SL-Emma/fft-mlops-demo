name: Release Model

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run ID of the successful CT workflow"
        required: true
        type: string

      version:
        description: "Model version, e.g. v1.0.0"
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download model artifact from CT workflow
        uses: actions/download-artifact@v4
        with:
          name: bearing-model
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-artifact

      - name: Show downloaded files
        run: find release-artifact -maxdepth 4 -type f

      - name: Create release package
        run: |
          mkdir -p release-package

          cp -r release-artifact/models release-package/
          cp -r release-artifact/metrics release-package/
          cp -r release-artifact/model_registry release-package/

          tar -czf bearing-model-${{ inputs.version }}.tar.gz \
            -C release-package .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: Bearing Model ${{ inputs.version }}
          generate_release_notes: true
          files: |
            bearing-model-${{ inputs.version }}.tar.gz
           
